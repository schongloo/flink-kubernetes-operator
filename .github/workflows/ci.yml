# We need to specify repo related information here since Apache INFRA doesn't differentiate
# between several workflows with the same names while preparing a report for GHA usage
# https://infra-reports.apache.org/#ghactions
name: Flink Kubernetes Operator CI

on:
  push:
    branches:
      - main
      - release-*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  HELM_CHART_DIR: helm
  FLINK_OPERATOR_CHART: flink-kubernetes-operator

jobs:
  e2e_ci:
    strategy:
      fail-fast: false
      matrix:
        flink-version:
          - "v2_2"
          - "v2_1"
          - "v2_0"
          - "v1_20"
        mode:
          - "native"
          - "standalone"
        test:
          - test_bluegreen_stateless.sh
          - test_bluegreen_laststate.sh
          - test_bluegreen_ingress_rotation.sh
    uses: ./.github/workflows/e2e.yaml
    with:
      java-version: 17
      flink-version: ${{ matrix.flink-version }}
      test: ${{ matrix.test }}
      mode: ${{ matrix.mode }}
  e2e_bluegreen_advanced:
    name: Blue/Green ADVANCED mode tests
    strategy:
      fail-fast: false
      matrix:
        flink-version:
          - "v2_2"
          - "v2_1"
          - "v2_0"
          - "v1_20"
        mode:
          - "native"
          - "standalone"
    uses: ./.github/workflows/e2e.yaml
    with:
      java-version: 17
      flink-version: ${{ matrix.flink-version }}
      test: test_bluegreen_advanced.sh
      mode: ${{ matrix.mode }}
      # The job bundles the gate client, which is Java 17 bytecode
      append-java-version: true
